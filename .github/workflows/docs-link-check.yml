name: Docs Link Check

on:
  pull_request:
    paths:
      - "**/*.md"
  push:
    branches: [master]
    paths:
      - "**/*.md"

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          check-modified-files-only: "yes"
        continue-on-error: true
